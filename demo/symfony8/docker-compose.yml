name: page-layout-kit-bundle-demo-symfony-8

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: page-layout-kit-bundle-demo-symfony-8-php
    working_dir: /app
    ports:
      - "${PORT:-8127}:80"
    volumes:
      - .:/app
      - ../..:/var/page-layout-kit-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
    # Public DNS for Composer / Packagist (Docker/WSL resolver failures)
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - page-layout-kit-demo-network

volumes:
  composer-cache:

networks:
  page-layout-kit-demo-network:
    driver: bridge
