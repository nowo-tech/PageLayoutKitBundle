nowo_page_layout_kit:
    default_locale: en
    locales: [en, es]
    pages: [home, contact]
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false
    web_ui:
        # layout_template: null (default) = nowo_ui_kit.layouts.admin (layouts/admin.html.twig, REQ-UI-003).
        # pageKey => route name for the admin "View page" link and post-save redirect (since 1.3.0).
        page_routes:
            home: home
            contact: contact
    doctrine:
        table_prefix: ''
