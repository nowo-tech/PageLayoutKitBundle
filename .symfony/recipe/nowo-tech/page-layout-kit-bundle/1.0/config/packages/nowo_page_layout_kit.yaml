nowo_page_layout_kit:
    default_locale: es
    locales: [es, en]
    pages: [home, contact]
    security:
        access_roles: [ROLE_EDITOR]
        allow_unauthenticated: false
    web_ui:
        # null = nowo_ui_kit.layouts.admin: set your admin layout once in UiKit (REQ-UI-003).
        layout_template: null
    html:
        sanitize:
            strategy: allowlist
    doctrine:
        table_prefix: ''

when@prod:
    nowo_page_layout_kit:
        html:
            sanitize:
                strategy: allowlist
