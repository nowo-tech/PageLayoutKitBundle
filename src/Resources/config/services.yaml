services:
    _defaults:
        autowire: true
        autoconfigure: true

    Nowo\PageLayoutKitBundle\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../Entity/'
            - '../../Controller/'
            - '../../NowoPageLayoutKitBundle.php'
            - '../../Resources/'
            - '../../Security/PageLayoutProtection.php'
            - '../../Security/PageLayoutProtectionConfig.php'
            - '../../Security/Html/'

    # REQ-SF-004 rule 7: controllers are registered explicitly, NOT autoconfigured. On Symfony >= 7.3 a #[Route]
    # class is autoconfigured with the routing.controller tag and the host's `routing.controllers` resource would
    # expose the admin routes even when the host never imports the bundle routing.yaml.
    Nowo\PageLayoutKitBundle\Controller\:
        resource: '../../Controller/'
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Nowo\PageLayoutKitBundle\Controller\Admin\PageBlockEditController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $pageLocales: '@Nowo\PageLayoutKitBundle\Locale\PageLocales'

    Nowo\PageLayoutKitBundle\Locale\PageLocales:
        public: true
        arguments:
            $defaultLocale: '%nowo_page_layout_kit.default_locale%'
            $locales: '%nowo_page_layout_kit.locales%'

    Nowo\PageLayoutKitBundle\Form\:
        resource: '../../Form/'
        tags: ['form.type']

    Nowo\PageLayoutKitBundle\Form\PageCardsBlockInlineModalType:
        tags: ['form.type']
        arguments:
            $pageLocales: '@Nowo\PageLayoutKitBundle\Locale\PageLocales'

    Nowo\PageLayoutKitBundle\Form\PageListBlockInlineModalType:
        tags: ['form.type']
        arguments:
            $pageLocales: '@Nowo\PageLayoutKitBundle\Locale\PageLocales'

    Nowo\PageLayoutKitBundle\Repository\PageBlockSqlRepository:
        arguments:
            $pageLocales: '@Nowo\PageLayoutKitBundle\Locale\PageLocales'

    Nowo\PageLayoutKitBundle\Twig\PageLayoutKitExtension:
        arguments:
            $layoutTemplate: '%nowo_page_layout_kit.web_ui.layout_template%'
            $cssFramework: '%nowo_page_layout_kit.web_ui.css_framework%'
            $pages: '%nowo_page_layout_kit.pages%'
            $defaultLocale: '%nowo_page_layout_kit.default_locale%'
        tags: ['twig.extension']

    Nowo\PageLayoutKitBundle\Service\PageBlockProvider:
        arguments:
            $legacyContentProvider: '@?Nowo\PageLayoutKitBundle\Legacy\LegacyPageContentProviderInterface'
            $protection: '@Nowo\PageLayoutKitBundle\Security\PageLayoutProtection'

    Nowo\PageLayoutKitBundle\EventSubscriber\PageBlockHtmlSanitizeSubscriber:
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }

    Nowo\PageLayoutKitBundle\Service\PageBlockMigrator:
        arguments:
            $legacyContentProvider: '@?Nowo\PageLayoutKitBundle\Legacy\LegacyPageContentProviderInterface'
            $pageLocales: '@Nowo\PageLayoutKitBundle\Locale\PageLocales'

    Nowo\PageLayoutKitBundle\Service\PublicPageUrlResolver:
        arguments:
            $pageRoutes: '%nowo_page_layout_kit.web_ui.page_routes%'
