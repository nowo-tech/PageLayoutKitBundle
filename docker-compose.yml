name: page-layout-kit-bundle

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: page-layout-kit-bundle-php
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/root/.composer/cache
      - coverage-data:/app/coverage
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - XDEBUG_MODE=coverage
      # REQ-RUNTIME-003: real-database concurrency tests (make test-with-db starts the "databases" profile).
      - PLK_MYSQL_URL=mysql://root@mysql:3306/plk?serverVersion=8.4.0&charset=utf8mb4
      - PLK_MARIADB_URL=mysql://root@mariadb:3306/plk?serverVersion=11.4.0-MariaDB&charset=utf8mb4
      - PLK_POSTGRES_URL=pgsql://postgres@postgres:5432/plk?serverVersion=16
    command: ["tail", "-f", "/dev/null"]
    networks:
      - page-layout-kit-bundle-network

  mysql:
    image: mysql:8.4
    profiles: [databases]
    environment: { MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_DATABASE: plk }
    healthcheck: { test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1'], interval: 5s, retries: 30 }
    networks:
      - page-layout-kit-bundle-network

  mariadb:
    image: mariadb:11.4
    profiles: [databases]
    environment: { MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes', MARIADB_DATABASE: plk }
    healthcheck: { test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized'], interval: 5s, retries: 30 }
    networks:
      - page-layout-kit-bundle-network

  postgres:
    image: postgres:16-alpine
    profiles: [databases]
    environment: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: plk }
    healthcheck: { test: ['CMD', 'pg_isready', '-U', 'postgres'], interval: 5s, retries: 30 }
    networks:
      - page-layout-kit-bundle-network

volumes:
  composer-cache:
    driver: local
  coverage-data:
    driver: local

networks:
  page-layout-kit-bundle-network:
    driver: bridge
